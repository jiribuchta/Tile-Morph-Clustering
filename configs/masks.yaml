defaults:
  - base
  - _self_

# Output of `run_clustering` (slides.parquet, centroids.npy).
clustering_out: ${project_path}/clustering/k32

# First N slides to mask (0 = all). Keep small for smoke tests.
slides: 0

# Max tile parts to scan/index/read (0 = all). Limited runs are not cached.
parts: 0

out: ???

mlflow_artifact_path: masks

metadata:
  run_name: Masks
  description: Per-slide cluster masks (BigTIFF, xOpat overlay) + report config, from clustering outputs
  hyperparams:
    slides: ${slides}
    parts: ${parts}
