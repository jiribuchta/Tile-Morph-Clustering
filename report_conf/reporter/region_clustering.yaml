# Report-tool config: region cluster masks (k=32) over MMCI B20-24 Val WSIs.
#
# Run:
#   python -m report --config-dir <dir_containing_this_file>/reporter \
#       +reporter=region_clustering user=jiribuchta
#
# The mask files are from cluster_regions.py (one .tiff per slide, tile-grid
# resolution, uint8: 0 = background, c+1 = cluster c). xOpat scales them to
# fit the WSI background.

defaults:
  - _self_

title: Region Clustering (k=32) - MMCI B20-24 Val

# --- background: the Val WSIs ---------------------------------------------
# Adjust source_dir to where the MMCI B20-24 Val WSIs are mounted.
background:
  _target_: report.masks.BasicImageRetriever
  source_dir: /mnt/data/MOU/breast/mammaprint
  globs: ["*.mrxs"]
  layer_name: MMCI B20-24 Val WSI

# --- mask layers: the region cluster masks ----------------------------------
mask_retrievers:
  - _target_: report.masks.DriveMasksRetriever
    dir_name: /mnt/projects/breast_cancer/tile_morph_clustering/region_clustering_1/masks
    layer_name: Region Clusters (k=32)
    shader_conf:
      type: colormap
      params:
        use_channel0: r
        opacity: 0.55
        connect:
          type: bool
          interactive: false
          default: true
        color:
          type: custom_colormap
          default:
          - ''            # value 0 = background
          - "#A64630"      # value 1 = cluster 0
          - "#F4A87B"      # value 2 = cluster 1
          - "#A67230"      # value 3 = cluster 2
          - "#F4D67B"      # value 4 = cluster 3
          - "#A69F30"      # value 5 = cluster 4
          - "#E5F47B"      # value 6 = cluster 5
          - "#81A630"      # value 7 = cluster 6
          - "#B8F47B"      # value 8 = cluster 7
          - "#55A630"      # value 9 = cluster 8
          - "#8AF47B"      # value 10 = cluster 9
          - "#30A638"      # value 11 = cluster 10
          - "#7BF499"      # value 12 = cluster 11
          - "#30A664"      # value 13 = cluster 12
          - "#7BF4C7"      # value 14 = cluster 13
          - "#30A690"      # value 15 = cluster 14
          - "#7BF4F4"      # value 16 = cluster 15
          - "#3090A6"      # value 17 = cluster 16
          - "#7BC7F4"      # value 18 = cluster 17
          - "#3064A6"      # value 19 = cluster 18
          - "#7B99F4"      # value 20 = cluster 19
          - "#3038A6"      # value 21 = cluster 20
          - "#8A7BF4"      # value 22 = cluster 21
          - "#5530A6"      # value 23 = cluster 22
          - "#B87BF4"      # value 24 = cluster 23
          - "#8130A6"      # value 25 = cluster 24
          - "#E57BF4"      # value 26 = cluster 25
          - "#A6309F"      # value 27 = cluster 26
          - "#F47BD6"      # value 28 = cluster 27
          - "#A63072"      # value 29 = cluster 28
          - "#F47BA8"      # value 30 = cluster 29
          - "#A63046"      # value 31 = cluster 30
          - "#4630A6"      # value 32 = cluster 31
          steps: 33
          mode: qualitative
          interactive: true
          title: 'Colormap:'
          continuous: false
        threshold:
          breaks:
          - 0.003922
          - 0.007843
          - 0.011765
          - 0.015686
          - 0.019608
          - 0.023529
          - 0.027451
