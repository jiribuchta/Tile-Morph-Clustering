# --- where the report is written --------------------------------------------
save:
  _target_: report.save.MLFlowReportStorer
  artifact_path: report.html
  metadata:
    experiment_name: Breast Cancer
    run_name: Region Clustering k32 - MMCI B20-24 Val
    description: Per-slide region cluster masks (k=32) overlaid on MMCI B20-24 Val WSIs
    user: ${user}
