# Minimal test: one slide, one mask
defaults:
  - _self_

title: LDA Test (1 slide)

background:
  _target_: report.masks.SlideRetriever
  paths:
    - /mnt/bioptic_tree/2020/00/479/2020_00479-01-T/2020_00479-01-T.mrxs
  layer_name: WSI

mask_retrievers:
  - _target_: report.masks.DriveMasksRetriever
    dir_name: /mnt/projects/breast_cancer/tile_morph_clustering/masks
    layer_name: LDA Score
    shader_conf:
      type: colormap
      params:
        use_channel0: r
        opacity: 0.5
        connect:
          type: bool
          interactive: false
          default: true
        color:
          type: custom_colormap
          default:
          - "#2166AC"
          - "#F7F7F7"
          - "#B2182B"
          steps: 3
          mode: qualitative
          interactive: true
          title: 'Score:'
          continuous: true
        threshold:
          breaks:
          - 0.0
          - 1.0
          mask:
          - 1
          - 1
          interactive: false
          inverted: false
          maskOnly: false
          toggleMask: false
          title: Range
          min: 0
          max: 1
          minGap: 0.1
          step: null
          pips:
            mode: range
            values: 2
            density: 4
            stepped: false

save:
  _target_: report.save.MLFlowReportStorer
  artifact_path: report.html
  metadata:
    experiment_name: Breast Cancer
    run_name: LDA test 1 slide
    description: Minimal test
    user: ${user}
